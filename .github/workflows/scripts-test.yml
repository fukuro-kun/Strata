name: Scripts test

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  node-test:
    if: github.repository == 'Niko1221/Strata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/item-check.test.js
